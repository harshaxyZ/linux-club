name: Vercel Preview Deployment

on:
  pull_request:
    branches:
      - master
      - main

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Clean Vercel State
        run: rm -rf .vercel

      - name: Pull Vercel Environment Information
        run: |
          vercel pull \
            --yes \
            --environment=preview \
            --token="$VERCEL_TOKEN" \
            --scope="$VERCEL_ORG_ID"

      - name: Build Project Artifacts
        run: |
          vercel build \
            --token="$VERCEL_TOKEN" \
            --scope="$VERCEL_ORG_ID"

      - name: Deploy Project Artifacts to Vercel
        id: deploy
        run: |
          PREVIEW_URL=$(vercel deploy \
            --prebuilt \
            --token="$VERCEL_TOKEN" \
            --scope="$VERCEL_ORG_ID")
          echo "preview_url=$PREVIEW_URL" >> "$GITHUB_OUTPUT"
          echo "Preview deployed to: $PREVIEW_URL"

      - name: Add Deployment Summary
        if: always()
        run: |
          echo "### 🚀 Vercel Preview Deployment" >> $GITHUB_STEP_SUMMARY
          if [ -n "${{ steps.deploy.outputs.preview_url }}" ]; then
            echo "**Preview URL:** [${{ steps.deploy.outputs.preview_url }}](${{ steps.deploy.outputs.preview_url }})" >> $GITHUB_STEP_SUMMARY
          fi
